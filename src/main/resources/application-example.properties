spring.application.name=tresorbackend

# Copy this file to application.properties and provide these values locally.
spring.datasource.url=jdbc:mysql://localhost:3306/tresordb
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

CROSS_ORIGIN=${CROSS_ORIGIN:http://localhost:3000}
PEPPER=${PEPPER}
RECAPTCHA_SECRET=${RECAPTCHA_SECRET}
